# pnpm 11 fails the install when a dependency build script is not approved.
# esbuild needs its script to check its platform binary.
allowBuilds:
  esbuild: true
  # transformers.js pulls these in. The browser build does not need their scripts.
  onnxruntime-node: false
  protobufjs: false
# Fox packages younger than pnpm's one-day minimum release age.
minimumReleaseAgeExclude:
  - foxgate@0.1.3
  - foxloop@0.1.6 || 0.1.8 || 0.1.9
  - foxnotify@0.1.0
  - foxpass@0.1.0
  - foxvoice@0.1.0
  - foxmind@0.1.3
  - foxpaw@0.1.6 || 0.1.7 || 0.1.8
  - foxbench@0.1.3
