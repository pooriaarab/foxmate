# pnpm 11 fails the install when a dependency build script is not approved.
# esbuild needs its script to check its platform binary.
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - create-foxkit@0.1.0
  - foxgate@0.1.0
  - foxloop@0.1.0
  - foxmind@0.1.0
  - foxpaw@0.1.0
  - foxmemory@0.1.0
  - foxshield@0.1.0
  - foxtrail@0.1.0
  - foxbench@0.1.0
