<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>foxmate</title>
    <link rel="stylesheet" href="sidebar.css" />
  </head>
  <body>
    <header>
      <h1>foxmate</h1>
      <span id="privacy" class="badge">Private</span>
    </header>
    <nav id="nav">
      <button type="button" data-view="chat" aria-pressed="true">Chat</button>
      <button type="button" data-view="activity">Activity</button>
      <button type="button" data-view="settings">Settings</button>
    </nav>
    <section data-view="chat">
      <ol id="conversation" aria-live="polite"></ol>
      <form id="goal-form">
        <label for="goal">Goal for the current tab</label>
        <textarea id="goal" rows="3" required placeholder="Sign me up for the Pro plan with my work email."></textarea>
        <div class="row">
          <button id="run" type="submit">Run</button>
          <button id="stop" type="button" disabled>Stop</button>
          <span id="status" role="status"></span>
        </div>
      </form>
    </section>
    <section data-view="activity" hidden>
      <div class="row"><p id="trail-status" class="muted">Reading the log…</p><button id="trail-export" type="button">Export</button></div>
      <p class="hint">foxtrail keeps every step of every run in a log that shows any change. It keeps short quotes of what foxshield flagged, not whole pages.</p>
      <ol id="trail" class="steps"></ol>
    </section>
    <section data-view="settings" hidden>
      <h2>Privacy</h2>
      <label class="inline"><input type="radio" name="privacy" value="private" /> Private: only models on this computer or in Firefox</label>
      <label class="inline"><input type="radio" name="privacy" value="own-key" /> Own key: a cloud model that you pay for with your key</label>
      <p id="privacy-hint" class="hint"></p>
      <label for="planner">Planner</label>
      <select id="planner"></select>
      <p id="planner-hint" class="hint"></p>
      <div data-for="saluki ollama llama-server openai anthropic">
        <label for="model">Model name</label><input id="model" autocomplete="off" />
        <label for="base-url">Server address</label><input id="base-url" autocomplete="off" />
      </div>
      <div data-for="openai anthropic">
        <label for="api-key">API key</label>
        <div class="row"><input id="api-key" type="password" autocomplete="off" /><button id="save-key" type="button">Save key</button></div>
        <p id="key-status" class="hint">foxvault keeps the key encrypted. The planner gets only a handle.</p>
        <label class="inline"><input id="consent" type="checkbox" /> Send page text to this provider</label>
      </div>
      <div data-for="scripted"><label for="script">Script (JSON tool calls)</label><textarea id="script" rows="6"></textarea></div>
    </section>
    <script type="module" src="sidebar.js"></script>
  </body>
</html>
