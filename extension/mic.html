<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>foxmate: set up the microphone</title>
    <link rel="stylesheet" href="sidebar.css" />
  </head>
  <body>
    <h1>Set up the microphone</h1>
    <p>foxmate uses the microphone only while you hold the talk button in Chat. Firefox asks once in this tab, and then the sidebar can use it.</p>
    <p class="hint">The audio stays on this computer. Whisper turns it into text in Firefox.</p>
    <div class="row"><button id="allow" type="button">Allow the microphone</button></div>
    <p id="result" role="status"></p>
    <script type="module" src="mic.js"></script>
  </body>
</html>
